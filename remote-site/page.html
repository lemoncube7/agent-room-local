<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1117"><link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"><link rel="apple-touch-icon" href="/icons/192.png"><title>Agent Room · 원격</title>
<style>
:root{color-scheme:dark;--bg:#0f1117;--panel:#161922;--raised:#1e222d;--hover:#282d3a;--line:#2a2f3b;--text:#e8eaf0;--muted:#9aa1b0;--accent:#7c9cff;background:var(--bg);color:var(--text);font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;font-size:14px;line-height:1.55}

.act-limit-row{display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
.act-bar{height:4px;border-radius:999px;background:var(--raised);overflow:hidden}.act-bar>i{display:block;height:100%;border-radius:999px;background:#4fd1a5}

#history{flex:1 1 0;min-height:0;overflow:auto;overscroll-behavior:contain;padding:18px max(22px,calc((100% - 860px)/2));display:flex;flex-direction:column;gap:12px}

article.codex{border-inline-start-color:#6ea8ff}article.claude{border-inline-start-color:#f0a27a}article.agy{border-inline-start-color:#8fd16f}

.md{color:var(--text);overflow-wrap:anywhere}.md>*{margin:0 0 6px}.md>*:last-child{margin-bottom:0}
.md p{white-space:pre-wrap;overflow-wrap:anywhere}
.md .code-wrap{position:relative}
.md pre{overflow:auto;max-width:100%;padding:30px 10px 10px;margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.md pre code{white-space:pre;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.md .copy-btn{position:absolute;top:6px;right:6px;z-index:2;padding:2px 8px;font-size:11px;border-radius:6px;background:var(--raised);border:1px solid var(--line);color:var(--text)}
.md :not(pre)>code{background:var(--raised);border-radius:4px;padding:1px 5px;font-size:.92em}
.md a{color:var(--accent)}.md blockquote{margin:0 0 6px;padding-left:10px;border-left:2px solid #596584;color:var(--muted)}.md ul,.md ol{padding-left:20px}.md hr{border:0;border-top:1px solid var(--line);margin:8px 0}.md table{border-collapse:collapse;max-width:100%;font-size:13px;overflow:auto;display:block}.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left}.md th{background:var(--raised)}

@media(max-width:720px){
 body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
 aside{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:8px;max-height:32vh}

 header,#history,#approvals,#compose-wrap{padding-left:14px;padding-right:14px}

}
body:not(.agents-hidden){grid-template-columns:clamp(170px,18vw,230px) minmax(0,1fr) minmax(250px,300px)}
#agent-panel{min-height:0;overflow:auto;padding:12px;background:var(--panel);border-left:1px solid var(--line)}
#agent-panel[hidden]{display:none}#agent-panel h3{font-size:14px;margin:0 0 8px}

@media(max-width:720px){body:not(.agents-hidden){grid-template-columns:minmax(0,1fr)}}
@media(min-width:851px){#close-agents{display:none}}

 body,body:not(.agents-hidden){display:block}
 main{height:100%}header{padding-top:max(10px,env(safe-area-inset-top))}
 #history{padding-block:12px}#compose-wrap{padding-block:8px}
 #draft,#new-room input{font-size:16px}

 #mobile-nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--panel);border-top:1px solid var(--line);padding:5px max(8px,env(safe-area-inset-right)) max(5px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
 #mobile-nav{position:relative;z-index:11}
 #mobile-nav button{padding:4px 6px;background:transparent;border-color:transparent;font-size:13px}
 #mobile-nav button[aria-pressed=true]{background:var(--raised);color:var(--accent)}
 #toggle-act{display:none}
 body>aside,#agent-panel{position:fixed;z-index:10;top:0;bottom:calc(55px + env(safe-area-inset-bottom));width:min(340px,88vw);max-height:none;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:12px;overflow:auto}
 body>aside{left:0}body:not(.rooms-open)>aside{display:none}
 #close-rooms{display:block;align-self:flex-end}
 #rooms{display:grid;overflow:visible}#rooms button{min-height:44px}
 #panel-scrim:not([hidden]){display:block;position:fixed;inset:0;z-index:9;background:#0009;border:0;border-radius:0;width:100%}
 #approvals{max-height:32dvh}
}
</style>
<aside>
 <button id="close-rooms" type="button">방 목록 닫기</button>
 <div class="brand"><h1>Agent Room <span class="remote-badge">원격</span></h1><span id="conn" class="pill"><i></i>연결 중</span></div>
 <button id="install-app" type="button" hidden>앱 설치</button>
 <form id="new-room" autocomplete="off"><input name="name" placeholder="새 채팅방 이름" maxlength="70" required><button type="submit" aria-label="방 만들기">+</button></form>

<main>

   </div>
  </div>
 </header>

  <form id="compose" autocomplete="off"><textarea id="draft" rows="1" aria-label="메시지" placeholder="메시지 보내기 (Shift+Enter 줄바꿈)" maxlength="8000" required></textarea><button type="submit">보내기</button></form>

 </div>

</section>
<script>
const historyView=document.querySelector('#history'),statusLine=document.querySelector('#status'),draft=document.querySelector('#draft'),form=document.querySelector('#compose');
const conn=document.querySelector('#conn'),roomsNav=document.querySelector('#rooms'),actBox=document.querySelector('#activity'),appBox=document.querySelector('#approvals');
const modeSel=document.querySelector('#mode-sel'),mainSel=document.querySelector('#main-sel'),toggleAct=document.querySelector('#toggle-act'),titleEl=document.querySelector('#title');
let cursor='',pending,selected='',request=0,lastSnap=null,lastRooms=[],showAct=!matchMedia('(max-width:850px)').matches;
let refreshInFlight=0;
const controlRequests=new Map();
function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e;}
function agentCls(name,provider){
 if(name==='나')return 'own';
 if(provider==='agy'||/^(agy|antigravity)/i.test(name||'')||name?.includes('수소'))return 'agy';
 if(provider==='codex'||/^(codex|gpt|chatgpt|sol)\b/i.test(name||'')||name?.includes('솔'))return 'codex';
 if(provider==='claude'||/^(claude|opus|sonnet|haiku)/i.test(name||'')||name?.includes('오푸스'))return 'claude';
 return '';
}
function inlineMd(target,text){
 const pattern=/`([^`\n]+)`|\*\*([^*\n]+)\*\*|\*([^*\n]+)\*|\[([^\]\n]+)\]\((<\/[A-Za-z]:\/[^>\r\n]+>|(?:https?:\/\/|file:\/\/\/?|\/[A-Za-z]:\/)[^\s)]+)\)|(?<![\w/#])(#(?:[\da-fA-F]{8}|[\da-fA-F]{6}|[\da-fA-F]{4}|[\da-fA-F]{3}))(?![\w/-])/g;
 const addSwatch=color=>{
  const swatch=el("span","");
  swatch.setAttribute("aria-hidden","true");
  swatch.style.cssText="display:inline-block;width:.8em;height:.8em;margin-inline-start:.35em;box-sizing:border-box;border:1px solid currentColor;border-radius:2px;vertical-align:baseline";
  swatch.style.backgroundColor=color;
  target.append(swatch);
 };
 let start=0;
 for(const match of text.matchAll(pattern)){
  target.append(document.createTextNode(text.slice(start,match.index)));
  if(match[5]){
   try{const url=new URL(match[5].startsWith('<')?'file://'+ match[5].slice(1,-1):match[5].startsWith('/')?'file://'+ match[5]:match[5]);const a=el('a',match[4]);a.href=url.href;a.title=url.href;if(url.protocol==='file:'){const lp=decodeURIComponent(url.pathname).replace(/^\/([A-Za-z]:)/,'$1').replace(/\//g,'\\');a.onclick=e=>{e.preventDefault();navigator.clipboard?.writeText(lp).catch(()=>{});statusLine.textContent='경로 복사됨: '+lp;};}else{a.target='_blank';a.rel='noopener noreferrer';}target.append(a);}
   catch{target.append(document.createTextNode(match[0]));}
  }else if(match[1]){target.append(el('code',match[1]));if(/^#(?:[\da-fA-F]{8}|[\da-fA-F]{6}|[\da-fA-F]{4}|[\da-fA-F]{3})$/.test(match[1]))addSwatch(match[1]);}
  else if(match[6]){target.append(document.createTextNode(match[6]));addSwatch(match[6]);}
  else{const span=el(match[2]?'strong':'em','');inlineMd(span,match[2]||match[3]);target.append(span);}
  start=match.index+match[0].length;
 }
 target.append(document.createTextNode(text.slice(start)));
}
function renderMd(text){
 const root=el('div','');root.className='md';
 let p,list,code,table,tbody;
 const lines=String(text||'').split(/\r?\n/);
 for(let idx=0;idx<lines.length;idx++){
  let line=lines[idx];
  if(code){const end=line.match(/^\s*```+(.*)$/);if(end){code=null;if(!end[1].trim())continue;line=end[1];}else{code.append(document.createTextNode(line+'\n'));continue;}}
  const item=line.match(/^\s*([-+*]|\d+\.)\s+(.+)$/), heading=line.match(/^(#{1,6})\s+(.+)$/);
  if(!item)list=null;
  if(!/^\s*\|.*\|\s*$/.test(line)){table=null;tbody=null;}
  if(/^\s*```/.test(line)){
   const wrap=el('div','');wrap.className='code-wrap';
   const pre=el('pre',''), copy=el('button','복사'), codeEl=el('code','');
   code=codeEl;
   copy.type='button';copy.className='copy-btn';
   copy.onclick=()=>{const t=codeEl.textContent.replace(/\n$/,'');const done=()=>{copy.textContent='복사됨';setTimeout(()=>{copy.textContent='복사';},1400);};const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.focus();ta.select();if(document.execCommand('copy'))done();ta.remove();};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(done).catch(fb);else fb();};
   pre.append(codeEl);wrap.append(copy,pre);root.append(wrap);p=null;continue;
  }
  if(!line.trim()){p=null;continue;}
  if(/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)){root.append(document.createElement('hr'));p=null;continue;}
  if(/^\s*\|.*\|\s*$/.test(line)){
   const cells=line.trim().slice(1,-1).split('|').map(c=>c.trim());
   if(!table&&lines[idx+1]&&/^\s*\|(?:\s*:?-{3,}:?\s*\|)+\s*$/.test(lines[idx+1])){
    table=el('table','');const thead=el('thead',''),tr=el('tr','');
    for(const c of cells){const th=el('th','');inlineMd(th,c);tr.append(th);}
    thead.append(tr);tbody=el('tbody','');table.append(thead,tbody);root.append(table);idx++;p=null;continue;
   }
   if(tbody){const tr=el('tr','');for(const c of cells){const td=el('td','');inlineMd(td,c);tr.append(td);}tbody.append(tr);p=null;continue;}
  }
  if(item){const tag=/^\d/.test(item[1])?'OL':'UL';if(list?.tagName!==tag){list=el(tag,'');if(tag==='OL'){const n=parseInt(item[1],10);if(n>1)list.start=n;}root.append(list);}const li=el('li','');inlineMd(li,item[2]);list.append(li);p=null;continue;}
  if(heading||line.startsWith('> ')){const b=el(heading?'h'+Math.min(6,heading[1].length+2):'blockquote','');inlineMd(b,heading?heading[2]:line.slice(2));root.append(b);p=null;continue;}
  if(!p){p=el('p','');root.append(p);}else p.append(document.createElement('br'));
  inlineMd(p,line);
 }
 return root;
}
function fmtAge(ts){if(!ts)return '';const m=Math.max(0,Math.floor((Date.now()-ts)/60000));return m<1?'방금 기준':m<60?m+'분 전 기준':Math.floor(m/60)+'시간 전 기준';}
function fmtReset(raw){
 if(!raw)return '';
 const ms=typeof raw==='number'?(raw<1e12?raw*1000:raw):Date.parse(raw);
 if(!Number.isFinite(ms))return '';
 const d=new Date(ms),now=new Date(),t=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
 return (d.toDateString()===now.toDateString()?t:d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})+' '+t)+' 초기화';
}
async function sendControl(payload){
 try{
  const id=crypto.randomUUID();
  const r=await fetch('/api/room/browser',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,room:selected,...payload})});
  if(!r.ok)throw Error('요청을 저장하지 못했어요.');
  controlRequests.set(id,{target:payload.id_target||payload.participant,expires:Date.now()+30000});
  statusLine.textContent='요청을 보냈어요. PC 응답을 기다리는 중입니다.';
  return true;
 }catch(e){statusLine.textContent=e.message;return false;}
}
function renderRooms(rooms){
 roomsNav.replaceChildren(...rooms.map(r=>{
  const b=document.createElement('button');b.type='button';
  b.setAttribute('aria-current',String(r.id===selected));
  b.append(el('span',r.name));
  const approvals=(lastSnap?.approvals||[]).filter(item=>item.room===r.id).length;
  if(approvals)b.append(el('small','승인 '+approvals));
  if(lastSnap?.members?.some(m=>m.room===r.id&&m.busy)){const d=document.createElement('i');d.className='dot';d.title='작업 중';b.append(d);}
  b.onclick=()=>{selected=r.id;cursor='';pending=null;historyView.replaceChildren();if(mobileView())openMobilePane('chat');void refresh();};
  return b;
 }));
}
function renderPanel(){
 const roomObj=lastRooms.find(r=>r.id===selected);
 titleEl.textContent=roomObj?.name||'채팅방을 선택하세요';
 const ranking=lastSnap?.ranking?.find(r=>r.room===selected);
 const roomMode=ranking?.mode||(ranking?.enabled?'ranking':'broadcast');
 const members=(lastSnap?.members||[]).filter(m=>m.room===selected&&m.state!=='disconnected');
 const mainMember=roomMode==='hierarchy'?(members.find(m=>m.id===ranking?.main_member&&m.state==='approved')||members.find(m=>m.state==='approved'&&m.provider)):null;
 modeSel.hidden=!roomObj;
 if(roomObj)modeSel.value=roomMode;
 mainSel.hidden=!roomObj||roomMode!=='hierarchy'||!members.some(m=>m.state==='approved');
 if(!mainSel.hidden){
  const approved=members.filter(m=>m.state==='approved');
  mainSel.replaceChildren(...approved.map(m=>new Option('메인: '+m.name,m.id)));
  if(mainMember)mainSel.value=mainMember.id;
 }
 const labels={pending:'승인 대기',starting:'CLI 시작 중…',start_failed:'실행 실패',approved:'대기 중'};
 const winNames={five_hour:'5시간',seven_day:'7일',primary:'5시간',secondary:'7일','gemini-5h':'5시간','gemini-weekly':'7일','3p-5h':'5시간','3p-weekly':'7일'};
 actBox.replaceChildren(...members.map(m=>{
  const card=document.createElement('div');
  const cls=agentCls('',m.provider)||agentCls(m.name);
  card.className='act-card'+(cls?' '+cls:'');
  const pa=(lastSnap?.approvals||[]).find(a=>a.room===selected&&a.name===m.name);
  const dot=document.createElement('span');
  dot.className='act-dot'+(pa||m.conflict?' approval':m.busy?' busy':m.cliError||m.state==='start_failed'?' error':'');
  const name=el('span',m.name+(mainMember?.id===m.id?' [메인]':''));name.className='act-name';name.prepend(dot);
  const lim=m.provider?lastSnap?.limits?.[m.provider]:null;
  const rawW=lim?.windows&&typeof lim.windows==='object'?lim.windows:null;
  const entries=!rawW?[]:m.provider==='agy'?((!m.model||/gemini/i.test(m.model))?['gemini-5h','gemini-weekly']:['3p-5h','3p-weekly']).filter(k=>rawW[k]&&typeof rawW[k]==='object').map(k=>[k,rawW[k]]):Object.entries(rawW).filter(([,w])=>w&&typeof w==='object');
  const meta=el('span',entries.length?(fmtAge(lim.updatedAt)||'잔여량'):'잔여량 정보 없음');meta.className='act-meta';
  const head=document.createElement('div');head.className='act-head';head.append(name,meta);
  const elapsed=m.busy&&m.progress?.updatedAt?Math.max(0,Math.floor((Date.now()-m.progress.updatedAt)/1000)):0;
  const stepText=pa?'허용 요청 대기: '+pa.tool:m.conflict?'⚠ 동시 수정 주의: '+m.conflict:m.paused?'일시정지됨 (응답 중지)':m.busy?(m.progress?.task||m.progress?.step||'작업 진행 중…')+(elapsed>=2?' ('+elapsed+'초)':''):m.cliError?m.cliError.message:labels[m.state]||'대기 중';
  const step=el('div',stepText);step.className='act-step';step.title=stepText;
  card.append(head,step);
  const prev=m.busy&&m.progress?.preview?m.progress.preview.trim().split(/\r?\n/).filter(Boolean).at(-1):'';
  if(prev){const p=el('div',prev);p.className='act-preview';p.title=prev;card.append(p);}
  if(m.provider&&(m.state==='approved'||m.state==='start_failed')){
   const pause=el('button',m.paused?'재개':'일시정지');pause.type='button';pause.className='act-retry';
   pause.disabled=[...controlRequests.values()].some(item=>item.target===m.id);
   pause.onclick=async()=>{pause.disabled=true;if(!await sendControl({control:'pause_agent',participant:m.id,paused:!m.paused}))pause.disabled=false;};
   card.append(pause);
  }
  if(m.state==='start_failed'&&m.provider){
   const retry=el('button','다시 실행');retry.type='button';retry.className='act-retry';
   retry.disabled=[...controlRequests.values()].some(item=>item.target===m.id);
   retry.onclick=async()=>{retry.disabled=true;if(!await sendControl({control:'retry_agent',participant:m.id}))retry.disabled=false;};
   card.append(retry);
  }
  if(entries.length){
   const lb=document.createElement('div');lb.className='act-limits';
   for(const [k,w] of entries){
    const raw=w.resets_at??w.resetsAt, ms=typeof raw==='number'?(raw<1e12?raw*1000:raw):Date.parse(raw);
    const expired=Number.isFinite(ms)&&ms<=Date.now();
    const rem=expired?100:Math.max(0,Math.min(100,Math.round(100-(Number(w.utilization)||0)*100)));
    const row=document.createElement('div');row.className='act-limit';
    const top=document.createElement('div');top.className='act-limit-row';
    top.append(el('span',(winNames[k]||k)+' · 남음 '+rem+'%'),el('span',expired?'초기화됨':fmtReset(raw)));
    const bar=document.createElement('div');bar.className='act-bar';
    const fill=document.createElement('i');fill.style.width=rem+'%';
    if(rem<=10)fill.className='critical';else if(rem<=25)fill.className='low';
    bar.append(fill);row.append(top,bar);lb.append(row);
   }
   card.append(lb);
  }
  return card;
 }));
 if(!members.length){
  const empty=el('p',!selected?'방을 선택해 주세요.':!lastSnap?'PC에서 에이전트 상태가 아직 도착하지 않았어요.':'이 방에 표시할 에이전트가 없어요.');
  empty.className='empty';actBox.append(empty);
 }
 appBox.replaceChildren(...(lastSnap?.approvals||[]).filter(item=>item.room===selected).map(item=>{
  const box=document.createElement('div'),roomName=lastRooms.find(r=>r.id===item.room)?.name||'',btns=document.createElement('footer');
  const decide=allow=>async()=>{for(const b of btns.children)b.disabled=true;if(!await sendControl({room:item.room,control:'approval_decide',id_target:item.id,allow}))for(const b of btns.children)b.disabled=false;};
  const deny=el('button','거부'),allow=el('button','이번만 허용');deny.type='button';allow.type='button';
  deny.onclick=decide(false);allow.onclick=decide(true);btns.append(deny,allow);
  for(const b of btns.children)b.disabled=[...controlRequests.values()].some(entry=>entry.target===item.id);
  box.append(el('strong',item.name+' · '+item.tool+' 실행 허용 요청'),el('small',' '+roomName),el('pre',item.input),btns);
  return box;
 }));
}
async function refresh(){
 refreshInFlight++;
 try{
  const turn=++request;
  const r=await fetch('/api/room/browser'+(selected?'?room='+encodeURIComponent(selected):''),{cache:'no-store',signal:AbortSignal.timeout(12000)});
  if(turn!==request)return;
  if(r.status===404&&selected){selected='';cursor='';historyView.replaceChildren();void refresh();return;}
  if(r.status===401||r.status===403)throw Error('이 사이트를 배포한 ChatGPT 계정으로 로그인해 주세요.');
  if(!r.ok)throw Error('원격 상태를 불러오지 못했어요. 잠시 후 다시 시도합니다.');
  const {events,rooms,snapshot}=await r.json();
  if(turn!==request)return;
  const fresh=Number.isFinite(snapshot?.syncedAt)&&Date.now()-snapshot.syncedAt<20000;
  conn.className=fresh?'pill':'pill err';conn.lastChild.textContent=fresh?'PC 연결됨':snapshot?'PC 동기화 대기':'PC 상태 없음';
  lastRooms=rooms;lastSnap=snapshot||null;
  for(const result of lastSnap?.controlResults||[]){
   if(controlRequests.delete(result.id))statusLine.textContent=result.ok?'PC에 반영됐어요.':'PC에서 요청을 처리하지 못했어요. 현재 상태를 확인해 주세요.';
  }
  for(const [id,item] of controlRequests)if(item.expires<Date.now()){
   controlRequests.delete(id);statusLine.textContent='아직 PC의 처리 결과를 확인하지 못했어요.';
  }
  if(!selected&&rooms.length){selected=rooms[0].id;void refresh();return;}
  draft.disabled=!selected;
  renderRooms(rooms);renderPanel();
  const busy=(lastSnap?.members||[]).filter(m=>m.room===selected&&m.busy);
  const key=JSON.stringify([events.map(e=>e.seq),busy.map(b=>[b.id,b.progress?.updatedAt,b.progress?.step])]);
  if(key===cursor)return;
  const nearBottom=historyView.scrollHeight-historyView.scrollTop-historyView.clientHeight<110||!cursor;
  cursor=key;
  const nodes=events.map(event=>{
   const a=document.createElement('article'),m=lastSnap?.members?.find(x=>x.room===selected&&x.name===event.name),cls=agentCls(event.name,m?.provider);
   if(cls)a.className=cls;
   a.append(el('strong',event.name),renderMd(event.text));
   return a;
  });
  for(const b of busy){
   const a=document.createElement('article'),cls=agentCls(b.name,b.provider);
   a.className=(cls?cls+' ':'')+'typing';
   a.append(el('strong',b.name));
   if(b.progress?.preview)a.append(renderMd(b.progress.preview));
   const elapsed=b.progress?.updatedAt?Math.max(0,Math.floor((Date.now()-b.progress.updatedAt)/1000)):0;
   a.append(el('small',(b.progress?.task||b.progress?.step||'작업 진행 중…')+(elapsed>=2?' ('+elapsed+'초)':'')));
   nodes.push(a);
  }
  if(!nodes.length){const empty=el('div','아직 대화가 없어요. 아래에서 메시지를 보내 보세요.');empty.className='empty';nodes.push(empty);}
  historyView.replaceChildren(...nodes);
  if(nearBottom)historyView.scrollTop=historyView.scrollHeight;
 }catch(e){conn.className='pill err';conn.lastChild.textContent='연결 확인 필요';statusLine.textContent=e.message;}
 finally{refreshInFlight--;}
}
function showAgentPanel(open){
 showAct=open;toggleAct.setAttribute('aria-expanded',String(open));
 document.querySelector('#agent-panel').hidden=!open;document.body.classList.toggle('agents-hidden',!open);
}
showAgentPanel(showAct);
toggleAct.onclick=()=>showAgentPanel(!showAct);
const mobileBreakpoint=matchMedia('(max-width:720px)');
function mobileView(){return mobileBreakpoint.matches;}
function openMobilePane(pane){
 document.body.classList.toggle('rooms-open',pane==='rooms');
 showAgentPanel(pane==='agents');
 document.querySelector('#panel-scrim').hidden=pane==='chat';
 for(const name of ['rooms','chat','agents'])document.querySelector('#mobile-'+name).setAttribute('aria-pressed',String(name===pane));
 if(pane!=='chat')document.querySelector('#close-'+pane).focus();
}
for(const pane of ['rooms','chat','agents'])document.querySelector('#mobile-'+pane).onclick=()=>openMobilePane(pane);
document.querySelector('#close-rooms').onclick=()=>{openMobilePane('chat');document.querySelector('#mobile-rooms').focus();};
document.querySelector('#close-agents').onclick=()=>{if(mobileView()){openMobilePane('chat');document.querySelector('#mobile-agents').focus();}else{showAgentPanel(false);toggleAct.focus();}};
document.querySelector('#panel-scrim').onclick=()=>openMobilePane('chat');
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&mobileView()&&!document.querySelector('#panel-scrim').hidden)openMobilePane('chat');});
mobileBreakpoint.addEventListener('change',()=>{openMobilePane('chat');if(!mobileView()&&innerWidth>850)showAgentPanel(true);});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
const installButton=document.querySelector('#install-app');
let installPrompt;
window.addEventListener('beforeinstallprompt',event=>{
 event.preventDefault();installPrompt=event;installButton.hidden=false;
});
installButton.onclick=async()=>{if(!installPrompt)return;const prompt=installPrompt;installPrompt=null;installButton.hidden=true;await prompt.prompt();};
window.addEventListener('appinstalled',()=>{installPrompt=null;installButton.hidden=true;});
modeSel.onchange=()=>void sendControl({control:'room_ranking',mode:modeSel.value,enabled:modeSel.value==='ranking',mainMember:mainSel.value||null});
mainSel.onchange=()=>void sendControl({control:'room_ranking',mode:'hierarchy',enabled:false,mainMember:mainSel.value||null});
document.querySelector('#new-room').onsubmit=async e=>{
 e.preventDefault();const inp=e.target.elements.name,name=inp.value.trim();if(!name)return;
 if(await sendControl({control:'create',name}))inp.value='';
};
form.onsubmit=async event=>{
 event.preventDefault();if(!selected||!draft.value.trim())return;
 if(pending?.text!==draft.value||pending.room!==selected)pending={id:crypto.randomUUID(),room:selected,text:draft.value};
 const button=event.submitter;button.disabled=true;
 try{
  const r=await fetch('/api/room/browser',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pending)});
  if(!r.ok)throw Error('전송하지 못했어요. 다시 시도해 주세요.');
  draft.value='';fitDraft();pending=null;statusLine.textContent='PC로 보낼 메시지를 대기열에 넣었어요.';
  void refresh();
 }catch(e){statusLine.textContent=e.message;}
 finally{button.disabled=false;}
};
function fitDraft(){draft.style.height='auto';draft.style.height=Math.min(draft.scrollHeight+2,180)+'px';}
draft.oninput=fitDraft;
draft.onkeydown=event=>{
 if(event.key!=='Enter'||event.shiftKey||event.isComposing||event.keyCode===229||matchMedia('(pointer:coarse)').matches)return;
 event.preventDefault();
 const button=form.querySelector('button');
 if(draft.value.trim()&&!button.disabled)form.requestSubmit(button);
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')void refresh();});
void refresh();setInterval(()=>{if(!refreshInFlight)void refresh();},2000);
</script></html>
