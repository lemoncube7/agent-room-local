<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Room Remote</title>
<style>
:root{color-scheme:dark;--bg:#0f1117;--panel:#161922;--raised:#1e222d;--hover:#282d3a;--line:#2a2f3b;--text:#e8eaf0;--muted:#9aa1b0;--accent:#7c9cff;background:var(--bg);color:var(--text);font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;font-size:14px;line-height:1.55}
*{box-sizing:border-box}
body{margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text)}
header{flex:none;padding:12px max(22px,calc((100% - 860px)/2));border-bottom:1px solid var(--line);background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:17px;margin:0}
.subtitle{margin:0;font-size:12px;color:var(--muted)}
.room-picker{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
select,textarea,button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--raised);color:var(--text);padding:7px 11px}
:is(select,textarea,button):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#history{flex:1 1 0;min-height:0;overflow:auto;overscroll-behavior:contain;padding:20px max(22px,calc((100% - 860px)/2));display:flex;flex-direction:column;gap:14px}
article{flex-shrink:0;max-width:min(82%,720px);min-width:0;align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
article strong{display:block;font-size:13px;color:#ffbf9e}
article p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
article.own{align-self:flex-end;background:#1f2a4a;border-color:#2f3f6e}
article.own strong{color:#b6c8ff}
footer{flex:none;border-top:1px solid var(--line);background:var(--bg);padding:12px max(22px,calc((100% - 860px)/2))}
form{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-width:0;max-height:180px;resize:none;overflow-y:auto;line-height:1.45;background:var(--panel);border-color:var(--line);border-radius:10px;padding:10px 14px}
button{flex:none;background:var(--accent);border-color:var(--accent);color:#0f1117;font-weight:600;padding:10px 18px;border-radius:10px;cursor:pointer}
button:hover{background:#98b2ff}
button:disabled{opacity:.5;cursor:default}
#status{margin:6px 0 0;min-height:1.2em;font-size:12px;color:var(--muted)}
#status:empty{display:none}
@media(max-width:640px){header,#history,footer{padding-left:14px;padding-right:14px}article{max-width:94%}}
</style>
<header>
 <div class="brand"><h1>Agent Room</h1><p class="subtitle">공유된 방만 표시됩니다.</p></div>
 <label class="room-picker">채팅방 <select id="rooms"></select></label>
</header>
<main id="history" aria-label="공용 대화"></main>
<footer>
 <form id="compose" autocomplete="off"><textarea id="draft" rows="1" aria-label="메시지" placeholder="메시지 보내기 (Shift+Enter 줄바꿈)" maxlength="8000" required></textarea><button>보내기</button></form>
 <p id="status" role="status"></p>
</footer>
<script>
const historyView=document.querySelector('#history'),statusLine=document.querySelector('#status'),draft=document.querySelector('#draft'),form=document.querySelector('#compose');
const picker=document.querySelector('#rooms');
let cursor='',pending,selected='',request=0;
picker.onchange=()=>{selected=picker.value;cursor='';pending=null;draft.value='';fitDraft();historyView.replaceChildren();void refresh();};
async function refresh(){
 try{
  const turn=++request;
  const r=await fetch('/api/room/browser'+(selected?'?room='+encodeURIComponent(selected):''),{cache:'no-store'});
  if(turn!==request)return;
  if(r.status===404&&selected){selected='';cursor='';historyView.replaceChildren();void refresh();return;}if(!r.ok)throw Error('소유자 계정으로 로그인해 주세요.');
  const {events,rooms}=await r.json();
  if(turn!==request)return;
  picker.replaceChildren(...rooms.map(room=>new Option(room.name,room.id)));
  if(!selected&&rooms.length){selected=rooms[0].id;void refresh();return;}
  picker.value=selected;draft.disabled=!selected;
  const key=JSON.stringify(events.map(event=>event.seq));if(key===cursor)return;cursor=key;
  historyView.replaceChildren(...events.map(event=>{const a=document.createElement('article'),n=document.createElement('strong'),p=document.createElement('p');if(event.name==='나')a.className='own';n.textContent=event.name;p.textContent=event.text;a.append(n,p);return a;}));
  historyView.scrollTop=historyView.scrollHeight;
 }catch(e){statusLine.textContent=e.message;}
}
form.onsubmit=async event=>{
 event.preventDefault();if(!selected||!draft.value.trim())return;
 if(pending?.text!==draft.value||pending.room!==selected)pending={id:crypto.randomUUID(),room:selected,text:draft.value};
 const button=event.submitter;button.disabled=true;
 try{
  const r=await fetch('/api/room/browser',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pending)});
  if(!r.ok)throw Error('전송하지 못했어요. 다시 시도해 주세요.');
  draft.value='';fitDraft();pending=null;statusLine.textContent='PC로 보낼 메시지를 대기열에 넣었어요.';
 }catch(e){statusLine.textContent=e.message;}
 finally{button.disabled=false;}
};
function fitDraft(){draft.style.height='auto';draft.style.height=Math.min(draft.scrollHeight+2,180)+'px';}
draft.oninput=fitDraft;
draft.onkeydown=event=>{
 if(event.key!=='Enter'||event.shiftKey||event.isComposing||event.keyCode===229||matchMedia('(pointer:coarse)').matches)return;
 event.preventDefault();
 const button=form.querySelector('button');
 if(draft.value.trim()&&!button.disabled)form.requestSubmit(button);
};
void refresh();setInterval(refresh,2500);
</script></html>
