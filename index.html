a2}dialog{width:min(420px,92vw);background:#202943;color:#edf0fa;border:1px solid #384362;border-radius:12px;padding:20px}#provider-buttons{display:flex;gap:6px;flex-wrap:wrap}#provider-buttons button[aria-pressed=true]{background:#345383;border-color:#8cb6ff}#handoff-dialog{width:min(740px,94vw);max-height:88vh}#task-form{display:grid;gap:8px}#task-form label{display:grid;gap:4px}#task-form textarea{resize:vertical;font:inherit;color:inherit;background:#252d46;border:1px solid #384362;border-radius:8px;padding:8px}#task-list{display:grid;gap:8px;margin:12px 0}#task-list article{max-width:100%;border:1px solid #384362}#task-list footer{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}dialog::backdrop{background:#0a0e1bb8}#ranking-form{display:grid;gap:12px}#ranking-form p{margin:0}#ranking-form p:empty,#ranking-form small:empty{display:none}#ranking-form label{display:grid;gap:6px}#ranking-form select{font:inherit;padding:8px}#ranking-form footer{display:flex;gap:8px;justify-content:flex-end}#ranking-error{color:#ffb9ad}#ranking-form label.check,#agent-form label.check{display:flex;align-items:center;gap:8px}label.check[hidden]{display:none!important}label.check input{width:auto}#agent-form{display:grid;gap:12px}#agent-form label{display:grid;gap:6px}#agent-form select{font:inherit;padding:8px}#agent-form footer{display:flex;gap:8px;justify-content:flex-end}.markdown{color:#f4f6ff;overflow-wrap:anywhere;margin:7px 0}.markdown>*{margin:0 0 7px}.markdown>*:last-child{margin-bottom:0}.markdown pre{overflow:auto;max-width:100%;padding:8px;background:#14192a;border-radius:6px}.markdown pre code{white-space:pre}.markdown blockquote{margin-left:0;padding-left:10px;border-left:2px solid #7784a5}.markdown a{color:#b7d5ff}.markdown ul,.markdown ol{padding-left:22px}.markdown h3,.markdown h4,.markdown h5,.markdown h6{font-size:1em}article.typing small{display:block;margin-top:5px;color:#ffcf90}article p{white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0;color:#f4f6ff}small{color:#b8c5e0}article strong{color:#ffbf9e}#error{color:#ffb9ad;padding-top:8px}
:root{--bg:#0f1117;--panel:#161922;--raised:#1e222d;--hover:#282d3a;--line:#2a2f3b;--text:#e8eaf0;--muted:#9aa1b0;--accent:#7c9cff;background:var(--bg);color:var(--text);font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;font-size:14px;line-height:1.55}
body{grid-template-columns:clamp(200px,20vw,260px) minmax(0,1fr)}
aside{display:flex;flex-direction:column;gap:10px;background:var(--panel);border-color:var(--line);padding:18px 14px}

h1{display:flex;align-items:baseline;justify-content:space-between;font-size:17px;margin:0 0 4px}h1 small{font-size:11px;font-weight:400;color:var(--muted)}

header{padding:12px 22px;border-color:var(--line);background:var(--bg)}header h2{font-size:16px}#room-actions{gap:6px;margin-top:8px}#room-actions button{font-size:12px;padding:5px 10px}#reply-priority[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}

<aside><h1>Agent Room <small id="current-version" aria-label="현재 버전">버전 확인 중</small></h1><p id="remote-status">모든 채팅 원격 사용 설정</p> <button id="notify-toggle" type="button">완료 알림 꺼짐</button> <button id="update">업데이트 확인</button><p id="update-result" role="status"></p><form id="new" autocomplete="off"><input name="name" autocomplete="off" aria-label="채팅방 이름" placeholder="새 채팅방 이름" required maxlength="70"><button aria-label="채팅방 만들기">+</button></form><div id="error" role="status"></div><nav id="rooms"></nav></aside>
<main><header><h2 id="title">채팅방을 선택하세요</h2><div id="room-actions"><button id="pair" hidden>기존 대화 연결 코드 만들기</button><button id="add-agent" hidden>에이전트 추가</button><button id="open-handoff" hidden>작업 인계</button><button id="reply-priority" hidden aria-pressed="false" title="먼저 답할 에이전트를 고르는 기능과 판단 모델을 설정합니다.">답변 순위</button></div><p id="pair-guide" hidden></p><section id="people" aria-label="참가자"></section></header><section class="history" id="messages" aria-label="공용 대화"></section><section id="approvals" aria-label="허용 요청" aria-live="polite"></section><div id="attach-list" aria-label="첨부 파일 목록"></div><form id="compose" autocomplete="off" hidden style="padding: 12px 25px"><input id="attach" type="file" multiple hidden><button id="attach-btn" type="button" title="파일 첨부 (드래그·붙여넣기 가능)">+ 파일</button><textarea id="draft" rows="1" autocomplete="off" aria-label="메시지" placeholder="방 전체에 메시지 보내기 (Shift+Enter 줄바꿈, 파일 드래그/붙여넣기)" maxlength="8000"></textarea><button type="submit">보내기</button></form></main><dialog id="ranking-dialog"><form id="ranking-form"><h2>답변 순위 설정</h2><p>먼저 답할 에이전트 1명을 고릅니다. 나머지는 메시지를 읽고 대기하다가 필요할 때 호출됩니다.</p><label class="check"><input name="enabled" type="checkbox"> 이 방에서 사용</label><label>판단 CLI<select name="provider"><option value="codex">Codex</option><option value="claude">Claude Code</option></select></label><label>모델<select name="model"><option value="">CLI 기본 모델</option></select></label><label>추론 강도<select name="effort"><option value="low">낮음</option><option value="medium">보통</option><option value="high">높음</option></select></label><small id="ranking-status" role="status"></small><p id="ranking-error" role="status"></p><footer><button id="ranking-cancel" type="button">취소</button><button type="submit">저장</button></footer></form></dialog><dialog id="agent-dialog"><form id="agent-form" autocomplete="off"><h2 id="agent-title">에이전트 추가</h2><input type="hidden" name="provider" value="codex"><div id="provider-buttons" role="group" aria-label="CLI 종류"><button type="button" data-provider="codex">Codex</button><button type="button" data-provider="claude">Claude Code</button><button type="button" data-provider="agy">Antigravity</button></div><label>모델<select name="model"><option value="">CLI 기본 모델</option></select></label><label>추론 강도<select name="effort"><option value="">CLI 기본값</option><option value="low">낮음</option><option value="medium">보통</option><option value="high">높음</option></select></label><label>권한 (Claude · Antigravity)<select name="permission"><option value="edit">편집: 파일 수정만 자동 허용</option><option value="dev" selected>개발: 편집, 조회, 테스트·빌드, git 커밋</option><option value="full">전체: 모든 명령 자동 허용 (주의)</option></select></label><label id="clear-rules-label" class="check" hidden><input type="checkbox" name="clearRules"> <span id="clear-rules-text">항상 허용 목록 지우기</span></label><label>이름<input name="name" autocomplete="off" placeholder="비워 두면 모델명 사용" maxlength="120"></label><small id="model-status" role="status"></small><small id="agent-error" role="status"></small><footer><button type="button" id="agent-cancel">취소</button><button type="submit">저장</button></footer></form></dialog>
<dialog id="handoff-dialog"><h2>작업 인계</h2><div id="task-list"></div><form id="task-form" autocomplete="off"><input type="hidden" name="id"><input type="hidden" name="revision"><label>작업 제목<input name="title" required maxlength="120"></label><label>작업 내용·검증 결과<textarea name="summary" rows="3" maxlength="8000"></textarea></label><label>다음 행동<textarea name="next" rows="2" required maxlength="2000"></textarea></label><label id="task-owner-label">첫 담당자<select name="target"></select></label><button type="submit" id="save-task">작업 만들기</button><button id="reset-task" type="button" hidden>새 작업 쓰기</button></form><p id="handoff-error" role="status"></p><button id="close-handoff">닫기</button></dialog>
<script>
let composeRoom,selected,previous='',snapshot,refreshing=false,lastRendered,pairRoom;
let notifyEnabled=localStorage.getItem('agentRoomNotify')!=='0', prevBusy=new Map(), titleTimer=null;
function syncNotifyButton(){
 const btn=byId('notify-toggle');
 if(!btn)return;
 const perm=typeof Notification!=='undefined'?Notification.permission:'unsupported';
 btn.textContent=!notifyEnabled?'완료 알림 꺼짐':perm==='granted'?'완료 알림 켜짐':perm==='denied'?'브라우저 알림 차단됨 (소리만)':'완료 알림 켜짐 (클릭해 권한 허용)';
}
function playDoneChime(){
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
  const ctx=new Ctx(), osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(587.33,ctx.currentTime);osc.frequency.setValueAtTime(880,ctx.currentTime+0.09);
  gain.gain.setValueAtTime(0.08,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.28);
  osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.29);
 }catch{}
}
function notifyCompletion(names){
 if(!notifyEnabled||!names.length)return;
 playDoneChime();
 const label=names.join(', ')+' 응답 완료';
 if(document.hidden){
  clearInterval(titleTimer);
  let flip=false;
  titleTimer=setInterval(()=>{document.title=(flip=!flip)?'[완료] '+label:'Agent Room';},1000);
 }
 if(typeof Notification!=='undefined'&&Notification.permission==='granted'){
  try{const n=new Notification('Agent Room · 작업 완료',{body:label});setTimeout(()=>n.close(),6000);}catch{}
 }
}
window.addEventListener('focus',()=>{if(titleTimer){clearInterval(titleTimer);titleTimer=null;document.title='Agent Room';}});
byId('notify-toggle').onclick=async()=>{
 if(notifyEnabled&&typeof Notification!=='undefined'&&Notification.permission==='default'){
  try{await Notification.requestPermission();}catch{}
 }else{
  notifyEnabled=!notifyEnabled;
  localStorage.setItem('agentRoomNotify',notifyEnabled?'1':'0');
  if(notifyEnabled&&typeof Notification!=='undefined'&&Notification.permission==='default'){try{await Notification.requestPermission();}catch{}}
 }
 syncNotifyButton();
};
syncNotifyButton();
const byId=id=>document.getElementById(id);
function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e;}
function inlineMarkdown(target,text,allowLinks=true){
 const pattern=/`([^`\n]+)`|\*\*([^*\n]+)\*\*|\*([^*\n]+)\*|\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g;
 let start=0;
 for(const match of text.matchAll(pattern)){
  target.append(document.createTextNode(text.slice(start,match.index)));
  if(match[5]&&allowLinks){
   try{const url=new URL(match[5]);const link=el('a',match[4]);link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';target.append(link);}
   catch{target.append(document.createTextNode(match[0]));}
  }else if(match[5])target.append(document.createTextNode(match[0]));
  else target.append(el(match[1]?'code':match[2]?'strong':'em',match[1]||match[2]||match[3]));
  start=match.index+match[0].length;
 }
 target.append(document.createTextNode(text.slice(start)));
}
function markdown(text){
 const root=el('div','');root.className='markdown';
 let paragraph,list,code;
 for(const line of text.split(/\r?\n/)){
  if(code){
   if(/^\s*```\s*$/.test(line))code=null;else code.append(document.createTextNode(line+"\n"));
   continue;
  }
  const item=line.match(/^\s*([-+*]|\d+\.)\s+(.+)$/), heading=line.match(/^(#{1,6})\s+(.+)$/);
  if(!item)list=null;
  if(/^\s*```/.test(line)){const pre=el("pre","");code=el("code","");const copy=el("button","복사");copy.type="button";copy.className="copy-btn";copy.onclick=async()=>{const text=code.textContent.replace(/\n$/,'');try{await navigator.clipboard.writeText(text);}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove();}copy.textContent='복사됨';setTimeout(()=>{copy.textContent='복사';},1500);};pre.append(copy,code);root.append(pre);paragraph=null;continue;}
  if(!line.trim()){paragraph=null;continue;}
  if(item){
   const tag=/^\d/.test(item[1])?'OL':'UL';
   if(list?.tagName!==tag){list=el(tag,'');root.append(list);}
   const entry=el('li','');inlineMarkdown(entry,item[2]);list.append(entry);paragraph=null;continue;
  }
  if(heading||line.startsWith('> ')){
   const block=el(heading?'h'+Math.min(6,heading[1].length+2):'blockquote','');inlineMarkdown(block,heading?heading[2]:line.slice(2));root.append(block);paragraph=null;continue;
  }
  if(!paragraph){paragraph=el('p','');root.append(paragraph);}else paragraph.append(document.createElement('br'));
  inlineMarkdown(paragraph,line);
 }
 return root;
}
function err(message){byId('error').textContent=message;}
async function control(body){
 try{
 const res=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const next=await res.json();if(!res.ok)throw Error(next.error);
 err('');update(next);return true;
 }catch(e){err(e.message);return false;}
}
function update(next){
 byId('current-version').textContent=next.version?'v'+next.version:'버전 확인 불가';
 const finished=[];
 for(const m of next.members||[]){
  if(prevBusy.get(m.id)===true&&!m.busy&&m.state==='approved')finished.push(m.name);
  prevBusy.set(m.id,Boolean(m.busy));
 }
 if(previous&&finished.length)notifyCompletion(finished);
 const key=JSON.stringify(next);if(key===previous)return;previous=key;snapshot=next;
 if(!next.rooms.some(r=>r.id===selected))selected=next.rooms[0]?.id;
 render();
}
function agentCard(name,own=false,provider){
 const card=document.createElement('article');
 if(own)card.classList.add('own');
 else if(provider==='agy')card.classList.add('agy');
 else if(provider==='codex'||agentPane(name)==='gpt')card.classList.add('codex');
 else if(provider==='claude'||agentPane(name)==='claude')card.classList.add('claude');
 return card;
}
function agentPane(name){
 if(/^(codex|gpt|chatgpt)\b/i.test(name||''))return 'gpt';
 if(/^claude\b/i.test(name||''))return 'claude';
}
function render(){
 const roomChanged=lastRendered!==selected;
 const room=snapshot.rooms.find(r=>r.id===selected);
 lastRendered=selected;
 byId('title').textContent=room?.name||'채팅방을 선택하세요';

async function addFiles(fileList){

  if(pendingFiles.length>=10){err('파일은 한 번에 10개까지 첨부할 수 있어요.');break;}
  if(file.size>8*1024*1024){err(file.name+' 파일이 8MB를 초과합니다.');continue;}
  const buf=await file.arrayBuffer();
  let bin='';const bytes=new Uint8Array(buf);
  for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.subarray(i,i+8192));
  pendingFiles.push({name:file.name||'image.png',type:file.type,size:file.size,data:btoa(bin)});
 }
 renderAttachments();
}

  const res=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'check_update'})});
  const info=await res.json();if(!res.ok)throw Error(info.error);
  status.textContent=info.available?'설치됨 v'+info.version+' · 업데이트 '+info.latest+' ':'v'+info.version+'이 최신 버전이에요.';
  if(info.download){
   const link=el('a','Windows ZIP 받기');link.href=info.download;link.target='_blank';link.rel='noopener';
   const install=el('button','업데이트 설치');
   install.onclick=async()=>{
    install.disabled=true;
    try{
     const result=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'apply_update',tag:info.latest})});
     if(!result.ok)throw Error((await result.json()).error);
     status.textContent='설치 요청을 보냈어요. '+info.latest+' 실행을 확인하는 중이에요.';
    for(let attempt=0;attempt<200;attempt++){
     await new Promise(resolve=>setTimeout(resolve,2000));
     if('v'+snapshot?.version===info.latest){location.reload();return;}
     if(snapshot?.updateStatus){
      status.textContent=snapshot.updateStatus;
      if(/failed|실패/i.test(snapshot.updateStatus)){status.append(document.createTextNode(' '),link);return;}
     }
    }
    status.textContent='아직 '+info.latest+' 실행을 확인하지 못했어요. 현재 버전을 확인하거나 ZIP으로 설치하세요.';
    status.append(document.createTextNode(' '),link);
    }catch(error){err(error.message);install.disabled=false;}
   };
   status.append(install,document.createTextNode(' '),link);
  }
 }catch(error){status.textContent=error.message;}finally{button.disabled=false;}
};
window.addEventListener('pageshow',()=>{byId('new').reset();byId('compose').reset();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')void refresh();});
refresh();setInterval(refresh,1500);
</script></html>
