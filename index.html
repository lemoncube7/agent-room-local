<!doctype html><html lang="ko"><meta charset="utf-8"><title>Agent Room</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",sans-serif;background:#111526;color:#edf0fa}
*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:clamp(150px,17vw,230px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
aside{background:#181d31;border-right:1px solid #2e3651;padding:28px 20px;overflow:auto}
h1{font-size:21px;margin:0 0 24px}button,input{font:inherit;border-radius:9px;border:1px solid #384362;background:#252d46;color:inherit;padding:9px 12px}button{cursor:pointer}button:hover,button[aria-current=true]{background:#344265}form{display:flex;gap:5px}form[hidden]{display:none}input{width:100%;min-width:0}nav{display:grid;gap:8px;margin-top:20px}nav button{text-align:left}
main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}header{flex:none;padding:16px 25px;border-bottom:1px solid #2e3651;background:#111526}#room-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}#room-actions button{margin:0}#compose{flex:none;border-top:1px solid #2e3651}header h2{margin:0;font-size:18px}header p{margin:8px 0 0;color:#b8c5e0}header code{color:#9ce6d2}header button{margin-top:10px}#people{display:flex;gap:8px;flex-wrap:wrap;max-height:24vh;overflow:auto;margin-top:12px}#people:empty{display:none}#people span{background:#202943;border-radius:9px;padding:6px 9px}#people button{margin-left:8px;font-size:12px}.history{flex:1 1 0;min-height:0;overscroll-behavior:contain;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}article{flex-shrink:0;max-width:96%;min-width:0;background:#222c43;border-radius:13px;padding:12px 16px;align-self:flex-start}article.own{align-self:flex-end;background:#203d40}article.own strong{color:#9ce6d2}article.codex{background:#202d48;border-inline-start:3px solid #8cb6ff}article.codex>strong{color:#a9c8ff}article.claude{background:#392b31;border-inline-start:3px solid #f3a880}article.claude>strong{color:#ffc2a2}article.agy{background:#293627;border-inline-start:3px solid #9fd87f}article.agy>strong{color:#bdeca2}dialog{width:min(420px,92vw);background:#202943;color:#edf0fa;border:1px solid #384362;border-radius:12px;padding:20px}#provider-buttons{display:flex;gap:6px;flex-wrap:wrap}#provider-buttons button[aria-pressed=true]{background:#345383;border-color:#8cb6ff}#handoff-dialog{width:min(740px,94vw);max-height:88vh}#task-form{display:grid;gap:8px}#task-form label{display:grid;gap:4px}#task-form textarea{resize:vertical;font:inherit;color:inherit;background:#252d46;border:1px solid #384362;border-radius:8px;padding:8px}#task-list{display:grid;gap:8px;margin:12px 0}#task-list article{max-width:100%;border:1px solid #384362}#task-list footer{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}dialog::backdrop{background:#0a0e1bb8}#agent-form{display:grid;gap:12px}#agent-form label{display:grid;gap:6px}#agent-form select{font:inherit;padding:8px}#agent-form footer{display:flex;gap:8px;justify-content:flex-end}.markdown{color:#f4f6ff;overflow-wrap:anywhere;margin:7px 0}.markdown>*{margin:0 0 7px}.markdown>*:last-child{margin-bottom:0}.markdown pre{overflow:auto;max-width:100%;padding:8px;background:#14192a;border-radius:6px}.markdown pre code{white-space:pre}.markdown blockquote{margin-left:0;padding-left:10px;border-left:2px solid #7784a5}.markdown a{color:#b7d5ff}.markdown ul,.markdown ol{padding-left:22px}.markdown h3,.markdown h4,.markdown h5,.markdown h6{font-size:1em}article.typing small{display:block;margin-top:5px;color:#ffcf90}article p{white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0;color:#f4f6ff}small{color:#b8c5e0}article strong{color:#ffbf9e}#error{color:#ffb9ad;padding-top:8px}
</style>
<aside><h1>Agent Room <small id="current-version" aria-label="현재 버전">버전 확인 중</small></h1><button id="remote-room-settings">원격 방 설정</button> <button id="update">업데이트 확인</button><p id="update-result" role="status"></p><form id="new" autocomplete="off"><input name="name" autocomplete="off" aria-label="채팅방 이름" placeholder="새 채팅방 이름" required maxlength="70"><button aria-label="채팅방 만들기">+</button></form><div id="error" role="status"></div><nav id="rooms"></nav></aside>
<main><header><h2 id="title">채팅방을 선택하세요</h2><div id="room-actions"><button id="pair" hidden>기존 대화 연결 코드 만들기</button><button id="add-agent" hidden>에이전트 추가</button><button id="open-handoff" hidden>작업 인계</button></div><p id="pair-guide" hidden></p><section id="people" aria-label="참가자"></section></header><section class="history" id="messages" aria-label="공용 대화"></section><form id="compose" autocomplete="off" hidden style="padding: 12px 25px"><input id="draft" autocomplete="off" aria-label="메시지" placeholder="방 전체에 메시지 보내기" maxlength="8000" required><button type="submit">보내기</button></form></main><dialog id="remote-room-dialog"><h2>원격 방 설정</h2><p>선택한 방 이름과 이후의 공용 메시지만 사이트에 보냅니다.</p><div id="remote-room-list"></div><p id="remote-room-error" role="status"></p><button id="remote-room-save">저장</button> <button id="remote-room-cancel">닫기</button></dialog><dialog id="agent-dialog"><form id="agent-form" autocomplete="off"><h2 id="agent-title">에이전트 추가</h2><input type="hidden" name="provider" value="codex"><div id="provider-buttons" role="group" aria-label="CLI 종류"><button type="button" data-provider="codex">Codex</button><button type="button" data-provider="claude">Claude Code</button><button type="button" data-provider="agy">Antigravity</button></div><label>모델<select name="model"><option value="">CLI 기본 모델</option></select></label><label>추론 강도<select name="effort"><option value="">CLI 기본값</option><option value="low">낮음</option><option value="medium">보통</option><option value="high">높음</option></select></label><label>이름<input name="name" autocomplete="off" placeholder="비워 두면 모델명 사용" maxlength="120"></label><small id="model-status" role="status"></small><small id="agent-error" role="status"></small><footer><button type="button" id="agent-cancel">취소</button><button type="submit">저장</button></footer></form></dialog>
<dialog id="handoff-dialog"><h2>작업 인계</h2><div id="task-list"></div><form id="task-form" autocomplete="off"><input type="hidden" name="id"><input type="hidden" name="revision"><label>작업 제목<input name="title" required maxlength="120"></label><label>작업 내용·검증 결과<textarea name="summary" rows="3" maxlength="8000"></textarea></label><label>다음 행동<textarea name="next" rows="2" required maxlength="2000"></textarea></label><label id="task-owner-label">첫 담당자<select name="target"></select></label><button type="submit" id="save-task">작업 만들기</button><button id="reset-task" type="button" hidden>새 작업 쓰기</button></form><p id="handoff-error" role="status"></p><button id="close-handoff">닫기</button></dialog>
<script>
let composeRoom,selected,previous='',snapshot,refreshing=false,lastRendered,pairRoom;
const byId=id=>document.getElementById(id);
function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e;}
function inlineMarkdown(target,text,allowLinks=true){
 const pattern=/`([^`\n]+)`|\*\*([^*\n]+)\*\*|\*([^*\n]+)\*|\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g;
 let start=0;
 for(const match of text.matchAll(pattern)){
  target.append(document.createTextNode(text.slice(start,match.index)));
  if(match[5]&&allowLinks){
   try{const url=new URL(match[5]);const link=el('a',match[4]);link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';target.append(link);}
   catch{target.append(document.createTextNode(match[0]));}
  }else if(match[5])target.append(document.createTextNode(match[0]));
  else target.append(el(match[1]?'code':match[2]?'strong':'em',match[1]||match[2]||match[3]));
  start=match.index+match[0].length;
 }
 target.append(document.createTextNode(text.slice(start)));
}
function markdown(text){
 const root=el('div','');root.className='markdown';
 let paragraph,list,code;
 for(const line of text.split(/\r?\n/)){
  if(code){
   if(/^\s*```\s*$/.test(line))code=null;else code.append(document.createTextNode(line+"\n"));
   continue;
  }
  const item=line.match(/^\s*([-+*]|\d+\.)\s+(.+)$/), heading=line.match(/^(#{1,6})\s+(.+)$/);
  if(!item)list=null;
  if(/^\s*```/.test(line)){const pre=el("pre","");code=el("code","");pre.append(code);root.append(pre);paragraph=null;continue;}
  if(!line.trim()){paragraph=null;continue;}
  if(item){
   const tag=/^\d/.test(item[1])?'OL':'UL';
   if(list?.tagName!==tag){list=el(tag,'');root.append(list);}
   const entry=el('li','');inlineMarkdown(entry,item[2]);list.append(entry);paragraph=null;continue;
  }
  if(heading||line.startsWith('> ')){
   const block=el(heading?'h'+Math.min(6,heading[1].length+2):'blockquote','');inlineMarkdown(block,heading?heading[2]:line.slice(2));root.append(block);paragraph=null;continue;
  }
  if(!paragraph){paragraph=el('p','');root.append(paragraph);}else paragraph.append(document.createElement('br'));
  inlineMarkdown(paragraph,line);
 }
 return root;
}
function err(message){byId('error').textContent=message;}
async function control(body){
 try{
 const res=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const next=await res.json();if(!res.ok)throw Error(next.error);
 err('');update(next);return true;
 }catch(e){err(e.message);return false;}
}
function update(next){
 byId('current-version').textContent=next.version?'v'+next.version:'버전 확인 불가';
 const key=JSON.stringify(next);if(key===previous)return;previous=key;snapshot=next;
 if(!next.rooms.some(r=>r.id===selected))selected=next.rooms[0]?.id;
 render();
}
function agentCard(name,own=false,provider){
 const card=document.createElement('article');
 if(own)card.classList.add('own');
 else if(provider==='agy')card.classList.add('agy');
 else if(provider==='codex'||agentPane(name)==='gpt')card.classList.add('codex');
 else if(provider==='claude'||agentPane(name)==='claude')card.classList.add('claude');
 return card;
}
function agentPane(name){
 if(/^(codex|gpt|chatgpt)\b/i.test(name||''))return 'gpt';
 if(/^claude\b/i.test(name||''))return 'claude';
}
function render(){
 const roomChanged=lastRendered!==selected;
 const room=snapshot.rooms.find(r=>r.id===selected);
 lastRendered=selected;
 byId('title').textContent=room?.name||'채팅방을 선택하세요';
 for(const id of ['pair','add-agent','open-handoff'])byId(id).hidden=!room; byId('pair-guide').hidden=pairRoom!==selected;
 byId('rooms').replaceChildren(...snapshot.rooms.map(r=>{const b=el('button',r.name);b.setAttribute('aria-current',String(r.id===selected));b.onclick=()=>{selected=r.id;render();};return b;}));
 byId('people').replaceChildren(...snapshot.members.filter(m=>m.room===selected&&m.state!=='disconnected').map(m=>{
 const parent=snapshot.members.find(p=>p.id===m.parent);
 const labels={pending:'승인 대기',starting:'CLI 실행 확인 중',start_failed:'실행 실패',approved:'연결됨'};
 const badge=el('span',m.name+(parent?' · '+parent.name+'의 서브에이전트':'')+' · '+labels[m.state]);
 if(m.state==='starting')return badge;
 if(m.cliError){
  const diagnostic=el('button','오류 원인');diagnostic.title=m.cliError.message;
  diagnostic.onclick=()=>err('['+m.cliError.code+'] '+m.cliError.message);
  badge.append(diagnostic);
 }
 if(m.state==='start_failed'&&m.provider){
  const retry=el('button','다시 실행');
  retry.onclick=()=>control({action:'retry_agent',room:selected,participant:m.id});
  badge.append(retry);
 }
 const b=el('button',m.state==='pending'?'승인':m.state==='start_failed'?'목록에서 제거':'연결 해제');
 b.onclick=()=>control({action:m.state==='pending'?'approve':'disconnect',participant:m.id});
 if(m.provider&&m.state==='approved'){
  const settings=el('button','설정');settings.onclick=()=>openAgentDialog(m);badge.append(settings);
 }
 badge.append(b);return badge;
 }));
 if(composeRoom!==selected)byId('draft').value='';
 composeRoom=selected;
 const people=snapshot.members.filter(m=>m.room===selected&&m.state==='approved');
 byId('compose').hidden=!people.length;
 const messages=snapshot.messages.filter(m=>m.room===selected);
 renderHistory(byId('messages'),messages,people.filter(agent=>agent.busy),roomChanged);
 if(byId('handoff-dialog').open)renderHandoff();
}
function renderHistory(view,messages,typing,roomChanged){
 const oldTop=view.scrollTop, previousTail=view.lastElementChild?.dataset.key, previousMessage=view.dataset.latest;
 const status={queued:'대기 중',accepted:'전달 접수',submitting:'전달 중',working:'전달 접수',answered:'응답 완료',no_reply:'답장 없음',uncertain:'전달 불확실',failed:'응답 실패'};
 view.replaceChildren(...messages.map(m=>{
  const author=snapshot.members.find(member=>member.id===m.author);
  const target=m.recipient?snapshot.members.find(member=>member.id===m.recipient):null;
  const card=agentCard(m.name,m.author==='human:'+selected,author?.provider);card.dataset.key='message:'+m.seq;
  const delivery=snapshot.deliveries.filter(d=>d.seq===m.seq).map(d=>d.name+' · '+status[d.state]).join(' / ');
  card.append(el('strong',m.name+(target?' → '+target.name:'')),markdown(m.body),el('small',new Date(m.created).toLocaleTimeString('ko-KR')+' · '+(delivery||'방에 저장됨')));
  return card;
 }));
 for(const agent of typing){
  const card=agentCard(agent.name,false,agent.provider);card.classList.add('typing');card.dataset.key='typing:'+agent.id;
  card.setAttribute('role','status');card.append(el('strong',agent.name),el('small','응답 생성 중…'));
  view.append(card);
 }
 if(!view.children.length)view.append(el('small','아직 메시지가 없어요.'));
 view.dataset.latest=String(messages.at(-1)?.seq??'');
 if(roomChanged||previousTail!==view.lastElementChild?.dataset.key||previousMessage!==view.dataset.latest)view.scrollTop=view.scrollHeight;
 else view.scrollTop=oldTop;
}
async function refresh(){
 if(refreshing)return;refreshing=true;
 try{const res=await fetch('/state');if(!res.ok)throw Error('로컬 허브 연결을 확인하세요.');update(await res.json());}catch(e){err(e.message);}finally{refreshing=false;}
}
byId('new').onsubmit=async e=>{e.preventDefault();if(await control({action:'create',name:e.target.elements.name.value})){selected=snapshot.rooms.at(-1).id;render();e.target.reset();}};
async function makePair(instructions, launchCommand){
 const room=selected;
 const buttons=['pair','add-agent'].map(byId);
 for(const item of buttons)item.disabled=true;
 try{
  const response=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'room_code',room})});
  const next=await response.json();
  if(!response.ok)throw Error(next.error);
  if(selected!==room)return;
  pairRoom=room;
  const prompt='Agent Room MCP의 join_room_code 도구로 '+next.code+' 코드에 참가 요청해 줘.';
  const copy=el('button','연결 문장 복사');
  copy.onclick=()=>navigator.clipboard.writeText(prompt).then(()=>copy.textContent='복사됨').catch(()=>err('아래 연결 문장을 직접 복사하세요.'));
  const guide=byId('pair-guide');
  guide.replaceChildren(el('small',instructions),document.createElement('br'),el('code',prompt),document.createElement('br'),el('small','문장을 붙여 넣은 뒤 이 화면에서 참가 요청을 승인하세요. 코드는 참가자 한 명에 한 번만, 10분 동안 유효합니다.'),document.createElement('br'),copy);
  if(launchCommand){
   const copyCommand=el('button','시작 명령 복사');
   copyCommand.onclick=()=>navigator.clipboard.writeText(launchCommand).then(()=>copyCommand.textContent='복사됨').catch(()=>err('화면의 시작 명령을 직접 복사하세요.'));
   guide.prepend(el('code',launchCommand),document.createTextNode(' '),copyCommand,document.createElement('br'));
  }
  guide.hidden=false;
  err('');
 }catch(e){err(e.message);}finally{for(const item of buttons)item.disabled=false;}
}
byId('pair').onclick=()=>makePair('기존 대화를 열고 아래 문장을 붙여 넣으세요.');
let editingAgent,agentRoom,modelRequest=0;
const modelCache=new Map();
function openAgentDialog(agent){
 const form=byId('agent-form');
 form.reset();editingAgent=agent;agentRoom=selected;
 form.elements.provider.value=agent?.provider||'codex';
 selectProvider(form.elements.provider.value,Boolean(agent));
 if(agent){
  form.elements.effort.value=agent.effort||'';
  form.elements.name.value=agent.name===agent.model?'':agent.name;
 }
 byId('agent-title').textContent=agent?'에이전트 설정':'에이전트 추가';
 byId('agent-error').textContent='';
 byId('agent-dialog').showModal();
 void loadModels(agent?.model||'');
}
async function loadModels(current=''){
 const form=byId('agent-form'),provider=form.elements.provider.value,model=form.elements.model,request=++modelRequest,status=byId('model-status');
 model.replaceChildren(new Option('CLI 기본 모델',''));
 if(current)model.add(new Option(current,current));
 model.value=current;
 model.disabled=true;status.textContent='CLI 모델 목록을 불러오는 중…';
 try{
  let models=modelCache.get(provider);
  if(!models){
   const response=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list_models',provider})});
   const result=await response.json();if(!response.ok)throw Error(result.error);
   models=result.models;if(models.length)modelCache.set(provider,models);
  }
  if(request!==modelRequest)return;
  for(const entry of models){
   const option=[...model.options].find(o=>o.value===entry.id);
   if(option)option.textContent=entry.label;else model.add(new Option(entry.label,entry.id));
  }
  status.textContent=models.length?'':'CLI가 제공한 모델이 없어요.';
 }catch(error){if(request===modelRequest)status.textContent=error.message;}
 finally{if(request===modelRequest)model.disabled=false;}
}
function selectProvider(provider,locked=false){
 byId('agent-form').elements.provider.value=provider;
 for(const button of byId('provider-buttons').querySelectorAll('button')){
  button.setAttribute('aria-pressed',String(button.dataset.provider===provider));
  button.disabled=locked&&button.dataset.provider!==provider;
 }
}
for(const button of byId('provider-buttons').querySelectorAll('button')){
 button.onclick=()=>{if(!editingAgent){selectProvider(button.dataset.provider);void loadModels();}};
}
byId('add-agent').onclick=()=>openAgentDialog();
byId('agent-cancel').onclick=()=>byId('agent-dialog').close();
byId('agent-form').onsubmit=async event=>{
 event.preventDefault();
 const fields=event.target.elements, button=event.submitter;
 button.disabled=true;
 try{
  const payload={action:editingAgent?'edit_agent':'new_agent',room:agentRoom,participant:editingAgent?.id,
   provider:fields.provider.value,model:fields.model.value,effort:fields.effort.value,name:fields.name.value};
  if(await control(payload))byId('agent-dialog').close();
  else byId('agent-error').textContent=byId('error').textContent;
 }finally{button.disabled=false;}
};
byId('remote-room-settings').onclick=()=>{
 if(!snapshot)return;
 const selectedIds=new Set((snapshot.remoteRooms||[]).map(row=>row.room));
 const labels=snapshot.rooms.map(room=>{
  const label=el('label',''), box=document.createElement('input');
  box.type='checkbox';box.value=room.id;box.checked=selectedIds.has(room.id);
  box.style.width='auto';label.style.display='block';
  label.append(box,document.createTextNode(' '+room.name));return label;
 });
 byId('remote-room-list').replaceChildren(...labels);
 byId('remote-room-error').textContent='';
 byId('remote-room-dialog').showModal();
};
byId('remote-room-cancel').onclick=()=>byId('remote-room-dialog').close();
byId('remote-room-save').onclick=async()=>{
 const rooms=[...byId('remote-room-list').querySelectorAll('input:checked')].map(box=>box.value);
 if(await control({action:'remote_rooms',rooms}))byId('remote-room-dialog').close();
 else byId('remote-room-error').textContent=byId('error').textContent;
};
let handoffRoom,handoffRenderKey;
function handoffParticipants(){
 return snapshot.members.filter(person=>person.room===handoffRoom&&person.state==='approved');
}
function taskEdit(task){
 const form=byId('task-form'),fields=form.elements;
 form.reset();
 fields.id.value=task?.id||'';
 fields.revision.value=task?.revision||'';
 fields.title.value=task?.title||'';
 fields.summary.value=task?.summary||'';
 fields.next.value=task?.next||'';
 byId('task-owner-label').hidden=Boolean(task);
 byId('reset-task').hidden=!task;
 byId('save-task').textContent=task?'변경 저장':'작업 만들기';
}
async function taskAction(action,task,extra={}){
 const payload={action,room:handoffRoom,id:task.id,revision:task.revision,...extra};
 const ok=await control(payload);
 byId('handoff-error').textContent=ok?'':byId('error').textContent;
 return ok;
}
function renderHandoff(){
 const participants=handoffParticipants();
 const roomTasks=(snapshot.tasks||[]).filter(task=>task.room===handoffRoom);
 const renderKey=JSON.stringify([handoffRoom,roomTasks,participants.map(({id,name})=>({id,name}))]);
 if(renderKey===handoffRenderKey)return;handoffRenderKey=renderKey;
 const name=id=>snapshot.members.find(person=>person.id===id)?.name||'미배정';
 const owner=byId('task-form').elements.target, previous=owner.value;
 owner.replaceChildren(new Option('미배정',''),...participants.map(person=>new Option(person.name,person.id)));
 if(participants.some(person=>person.id===previous))owner.value=previous;
 byId('task-list').replaceChildren(...roomTasks.map(task=>{
  const card=el('article',''),buttons=el('footer','');
  const status=task.status==='offered'?'수락 대기 → '+name(task.offered_to):task.status==='done'?'완료':'진행 가능';
  card.append(el('strong','#'+task.id+' '+task.title),el('p',status+' · 담당 '+name(task.owner)),el('p',task.summary),el('p','다음 행동 · '+task.next));
  function action(label,fn){const button=el('button',label);button.onclick=fn;buttons.append(button);}
  if(task.status==='open'){
   action('수정',()=>taskEdit(task));
   const recipients=participants.filter(person=>person.id!==task.owner);
   if(recipients.length){
    const picker=document.createElement('select');picker.setAttribute('aria-label','인계받을 참가자');
    picker.append(new Option('받을 참가자 선택',''),...recipients.map(person=>new Option(person.name,person.id)));
    buttons.append(picker);
    action('인계 요청',()=>{if(picker.value)void taskAction('handoff_offer',task,{target:picker.value});});
   }
   action('완료',()=>{void taskAction('handoff_complete',task);});
  }else if(task.status==='offered'){
   action('수락 처리',()=>{void taskAction('handoff_accept',task);});
   action('거절 처리',()=>{void taskAction('handoff_decline',task);});
  }
  action('이력',async()=>{
   try{
    const response=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'handoff_history',room:handoffRoom,id:task.id})});
    const result=await response.json();if(!response.ok)throw Error(result.error);
    const labels={handoff_create:'생성',handoff_update:'수정',handoff_offer:'인계 요청',handoff_accept:'수락',handoff_decline:'거절',handoff_complete:'완료'};
    details.replaceChildren(...result.events.map(event=>el('p',new Date(event.created).toLocaleString('ko-KR')+' · '+(event.actor.startsWith('human:')?'나':name(event.actor))+' · '+labels[event.action]+(event.note?' · '+event.note:''))));
    details.hidden=!details.hidden;
   }catch(error){byId('handoff-error').textContent=error.message;}
  });
  const details=el('section','');details.hidden=true;
  card.append(buttons,details);return card;
 }));
}
byId('open-handoff').onclick=()=>{
 handoffRoom=selected;handoffRenderKey=null;taskEdit();renderHandoff();byId('handoff-error').textContent='';byId('handoff-dialog').showModal();
};
byId('close-handoff').onclick=()=>byId('handoff-dialog').close();
byId('reset-task').onclick=()=>taskEdit();
byId('task-form').onsubmit=async event=>{
 event.preventDefault();
 const fields=event.target.elements, id=Number(fields.id.value);
 const ok=await control({action:id?'handoff_update':'handoff_create',room:handoffRoom,id,revision:Number(fields.revision.value),
  title:fields.title.value,summary:fields.summary.value,next:fields.next.value,target:fields.target.value});
 byId('handoff-error').textContent=ok?'':byId('error').textContent;
 if(ok)taskEdit();
};
byId('compose').onsubmit=async event=>{
 event.preventDefault();
 const button=event.submitter, draft=byId('draft'), text=draft.value, room=selected;
 button.disabled=true;
 try{
  if(await control({action:'user_message',room,text}) && selected===room && draft.value===text){draft.value='';}
 }finally{button.disabled=false;}
};
byId('update').onclick=async()=>{
 const button=byId('update'), status=byId('update-result');button.disabled=true;
 status.textContent='확인 중…';
 try{
  const res=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'check_update'})});
  const info=await res.json();if(!res.ok)throw Error(info.error);
  status.textContent=info.available?'설치됨 v'+info.version+' · 업데이트 '+info.latest+' ':'v'+info.version+'이 최신 버전이에요.';
  if(info.download){
   const link=el('a','Windows ZIP 받기');link.href=info.download;link.target='_blank';link.rel='noopener';
   const install=el('button','업데이트 설치');
   install.onclick=async()=>{
    install.disabled=true;
    try{
     const result=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'apply_update',tag:info.latest})});
     if(!result.ok)throw Error((await result.json()).error);
     status.textContent='설치 요청을 보냈어요. '+info.latest+' 실행을 확인하는 중이에요.';
    for(let attempt=0;attempt<40;attempt++){
     await new Promise(resolve=>setTimeout(resolve,2000));
     if('v'+snapshot?.version===info.latest){location.reload();return;}
     if(snapshot?.updateStatus){
      status.textContent=snapshot.updateStatus;
      if(/failed|실패/i.test(snapshot.updateStatus)){status.append(document.createTextNode(' '),link);return;}
     }
    }
    status.textContent='아직 '+info.latest+' 실행을 확인하지 못했어요. 현재 버전을 확인하거나 ZIP으로 설치하세요.';
    status.append(document.createTextNode(' '),link);
    }catch(error){err(error.message);install.disabled=false;}
   };
   status.append(install,document.createTextNode(' '),link);
  }
 }catch(error){status.textContent=error.message;}finally{button.disabled=false;}
};
window.addEventListener('pageshow',()=>{byId('new').reset();byId('compose').reset();});
refresh();setInterval(refresh,1500);
</script></html>
