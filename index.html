function playDoneChime(){
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
  const ctx=new Ctx(), osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(587.33,ctx.currentTime);osc.frequency.setValueAtTime(880,ctx.currentTime+0.09);
  gain.gain.setValueAtTime(0.08,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.28);
  osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.29);
 }catch{}
}

function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e;}
function inlineMarkdown(target,text,allowLinks=true){
 const pattern=/`([^`\n]+)`|\*\*([^*\n]+)\*\*|\*([^*\n]+)\*|\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g;
 let start=0;
 for(const match of text.matchAll(pattern)){
  target.append(document.createTextNode(text.slice(start,match.index)));
  if(match[5]&&allowLinks){
   try{const url=new URL(match[5]);const link=el('a',match[4]);link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';target.append(link);}
   catch{target.append(document.createTextNode(match[0]));}
  }else if(match[5])target.append(document.createTextNode(match[0]));
  else target.append(el(match[1]?'code':match[2]?'strong':'em',match[1]||match[2]||match[3]));
  start=match.index+match[0].length;
 }
 target.append(document.createTextNode(text.slice(start)));
}
function markdown(text){
 const root=el('div','');root.className='markdown';
 let paragraph,list,code;
 for(const line of text.split(/\r?\n/)){
  if(code){
   if(/^\s*```\s*$/.test(line))code=null;else code.append(document.createTextNode(line+"\n"));
   continue;
  }
  const item=line.match(/^\s*([-+*]|\d+\.)\s+(.+)$/), heading=line.match(/^(#{1,6})\s+(.+)$/);
  if(!item)list=null;
  if(/^\s*```/.test(line)){const pre=el("pre","");code=el("code","");const copy=el("button","복사");copy.type="button";copy.className="copy-btn";copy.onclick=async()=>{const text=code.textContent.replace(/\n$/,'');try{await navigator.clipboard.writeText(text);}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove();}copy.textContent='복사됨';setTimeout(()=>{copy.textContent='복사';},1500);};pre.append(copy,code);root.append(pre);paragraph=null;continue;}
  if(!line.trim()){paragraph=null;continue;}
  if(item){
   const tag=/^\d/.test(item[1])?'OL':'UL';
   if(list?.tagName!==tag){list=el(tag,'');root.append(list);}
   const entry=el('li','');inlineMarkdown(entry,item[2]);list.append(entry);paragraph=null;continue;
  }
  if(heading||line.startsWith('> ')){
   const block=el(heading?'h'+Math.min(6,heading[1].length+2):'blockquote','');inlineMarkdown(block,heading?heading[2]:line.slice(2));root.append(block);paragraph=null;continue;
  }
  if(!paragraph){paragraph=el('p','');root.append(paragraph);}else paragraph.append(document.createElement('br'));
  inlineMarkdown(paragraph,line);
 }
 return root;
}
function err(message){byId('error').textContent=message;}
async function control(body){

 const res=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

 }catch(e){err(e.message);return false;}
}
function update(next){

 const finished=[];
 for(const m of next.members||[]){
  if(prevBusy.get(m.id)===true&&!m.busy&&m.state==='approved')finished.push(m.name);
  prevBusy.set(m.id,Boolean(m.busy));
 }
 if(previous&&finished.length)notifyCompletion(finished);
 const key=JSON.stringify(next);if(key===previous)return;previous=key;snapshot=next;

}
function agentCard(name,own=false,provider){

 else if(provider==='codex'||agentPane(name)==='gpt')card.classList.add('codex');

}

function agentActions(m){

  const retry=el('button','다시 실행');

 }

function render(){

 const roomMode=ranking?.mode||(ranking?.enabled?'ranking':'broadcast');
 const mainMember=roomMode==='hierarchy'?(snapshot.members.find(m=>m.id===ranking?.main_member&&m.room===selected&&m.state==='approved')||snapshot.members.find(m=>m.room===selected&&m.state==='approved'&&m.provider)):null;
 byId('reply-priority').textContent=roomMode==='hierarchy'?'계층형 · 메인: '+(mainMember?.name||'미지정'):roomMode==='ranking'?'자동 순위 · '+(ranking.judge_model||({codex:'Codex',claude:'Claude Code',agy:'Antigravity'})[ranking.judge_provider||'codex']):'자유 · 동시 응답';

}
function formatLimitAge(ts){
 if(!ts)return '';
 const mins=Math.max(0,Math.floor((Date.now()-ts)/60000));
 return mins<1?'방금 기준':mins+'분 전 기준';
}
function formatResetTime(raw){
 if(!raw)return '';
 const ms=typeof raw==='number'?(raw<1e12?raw*1000:raw):Date.parse(raw);
 if(!Number.isFinite(ms))return '';
 const d=new Date(ms), now=new Date();
 const sameDay=d.toDateString()===now.toDateString();
 return sameDay
  ?d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})+' 초기화'
  :d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})+' '+d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})+' 초기화';
}
function renderActivity(members,messages,mainMember){
 const box=byId('activity');
 if(!box)return;
 const windowLabels={five_hour:'5시간',seven_day:'7일'};
 box.replaceChildren(...members.map(m=>{
  const card=document.createElement('div');
  const cls=m.provider==='agy'?'agy':m.provider==='codex'||agentPane(m.name)==='gpt'?'codex':m.provider==='claude'||agentPane(m.name)==='claude'?'claude':'';
  card.className='act-card'+(cls?' '+cls:'');
  const pendingApproval=(snapshot.approvals||[]).find(a=>a.room===selected&&a.name===m.name);
  const dot=document.createElement('span');
  dot.className='act-dot'+(pendingApproval||m.conflict?' approval':m.busy?' busy':m.cliError||m.state==='start_failed'?' error':'');
  const name=el('span',m.name);name.className='act-name';name.prepend(dot);
  if(mainMember?.id===m.id){const tag=el('span','메인');tag.className='act-main';name.append(tag);}
  const lim=m.provider?snapshot.limits?.[m.provider]:null;
  const entries=lim?.windows&&typeof lim.windows==='object'?Object.entries(lim.windows).filter(([,w])=>w&&typeof w==='object'):[];
  const meta=el('span',entries.length?(formatLimitAge(lim.updatedAt)||'잔여량'):'잔여량 정보 없음');meta.className='act-meta';
  const head=document.createElement('div');head.className='act-head';head.append(name,meta);
  const elapsed=m.busy&&m.progress?.updatedAt?Math.max(0,Math.floor((Date.now()-m.progress.updatedAt)/1000)):0;
  const stepText=pendingApproval?'허용 요청 대기: '+pendingApproval.tool
   :m.conflict?'⚠ 동시 수정 주의: '+m.conflict
   :m.paused?'일시정지됨 (호출·응답 중지)'
   :m.busy?(m.progress?.step||'작업 진행 중…')+(elapsed>=2?' ('+elapsed+'초)':'')
   :m.cliError?m.cliError.message
   :m.state==='pending'?'방 승인 대기 중'
   :m.state==='starting'?'CLI 시작 중…'
   :m.state==='start_failed'?'실행 실패'
   :m.provider?'대기 중':'연결됨';
  const step=el('div',stepText);step.className='act-step';step.title=stepText;
  card.append(head,step);
  const lastPreview=m.busy&&m.progress?.preview?m.progress.preview.trim().split(/\r?\n/).filter(Boolean).at(-1):'';
  const lastMsg=!m.busy?[...messages].reverse().find(msg=>msg.author===m.id)?.body?.trim().split(/\r?\n/).filter(Boolean)[0]:'';
  const subText=lastPreview||(lastMsg?'최근: '+lastMsg:'');
  if(subText){const sub=el('div',subText);sub.className='act-preview';sub.title=subText;card.append(sub);}
  if(entries.length){
   const limitsBox=document.createElement('div');limitsBox.className='act-limits';
   for(const [key,w] of entries){
    const rem=Math.max(0,Math.min(100,Math.round(100-(Number(w.utilization)||0)*100)));
    const reset=formatResetTime(w.resets_at??w.resetsAt);
    const row=document.createElement('div');row.className='act-limit';
    const top=document.createElement('div');top.className='act-limit-row';
    top.append(el('span',(windowLabels[key]||key)+' · 남음 '+rem+'%'),el('span',reset));
    const bar=document.createElement('div');bar.className='act-bar';
    const fill=document.createElement('i');fill.style.width=rem+'%';
    if(rem<=10)fill.className='critical';else if(rem<=25)fill.className='low';
    bar.append(fill);row.append(top,bar);limitsBox.append(row);
   }
   card.append(limitsBox);
  }
  const parent=snapshot.members.find(p=>p.id===m.parent);
  if(parent){const sub=el('div',parent.name+'의 서브에이전트');sub.className='act-parent';card.insertBefore(sub,step);}
  const actions=agentActions(m);if(actions.childElementCount)card.append(actions);
  return card;
 }));
}
function renderApprovals(){
 byId('approvals').replaceChildren(...(snapshot.approvals||[]).map(item=>{
  const box=el('div',''),room=snapshot.rooms.find(r=>r.id===item.room)?.name||'',buttons=el('footer','');
  const decide=(allow,always=false)=>async()=>{for(const b of buttons.children)b.disabled=true;if(!await control({action:'approval_decide',id:item.id,allow,always}))for(const b of buttons.children)b.disabled=false;};
  const deny=el('button','거부'),allow=el('button','이번만 허용');deny.onclick=decide(false);allow.onclick=decide(true);buttons.append(deny,allow);
  if(item.rule){const always=el('button','항상 허용');always.title=item.rule.replace(/^[^:]+:/,'')+' 명령을 이 에이전트에게 다시 묻지 않습니다.';always.onclick=decide(true,true);buttons.append(always);}
  box.append(el('strong',item.name+' · '+item.tool+' 실행 허용 요청'),el('small',' '+room),el('pre',item.input),buttons);
  return box;

function renderHistory(view,messages,typing,roomChanged){

 view.replaceChildren(...messages.map(m=>{

  const fallback=snapshot.replyPlans?.some(plan=>plan.seq===m.seq&&plan.state==='fallback');
  const delivery=sorted.map(d=>(d.priority===null||d.priority===undefined?'':d.priority+' · ')+d.name+' · '+status[d.state]).join(' / ')+(fallback?' · 기본 순서 사용':'');
  if(m.retracted)card.classList.add('retracted');
  card.append(el('strong',m.name+(target?' → '+target.name:'')),m.retracted?el('p','철회한 메시지입니다.'):markdown(m.body),el('small',new Date(m.created).toLocaleTimeString('ko-KR')+' · '+(delivery||'방에 저장됨')));
  if(m.author==='human:'+selected&&!m.retracted){
   const retract=el('button','철회');retract.type='button';retract.className='retract-btn';
   retract.onclick=()=>{if(confirm('이 메시지를 철회할까요? 아직 안 간 에이전트에게는 전달을 취소하고, 이미 받은 에이전트에게는 무시하라고 알립니다.'))control({action:'retract_message',room:selected,seq:m.seq});};
   card.append(retract);
  }
  return card;
 }));

async function loadModels(current=''){
 const form=byId('agent-form'),provider=form.elements.provider.value,model=form.elements.model,request=++modelRequest,status=byId('model-status');
 model.replaceChildren(new Option('CLI 기본 모델',''));

 model.value=current;
 model.disabled=true;status.textContent='CLI 모델 목록을 불러오는 중…';
 try{
  let models=modelCache.get(provider);
  if(!models){
   const response=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list_models',provider})});
   const result=await response.json();if(!response.ok)throw Error(result.error);
   models=result.models;if(models.length)modelCache.set(provider,models);
  }
  if(request!==modelRequest)return;
  for(const entry of models){
   const option=[...model.options].find(o=>o.value===entry.id);
   if(option)option.textContent=entry.label;else model.add(new Option(entry.label,entry.id));
  }
  status.textContent=models.length?'':'CLI가 제공한 모델이 없어요.';
 }catch(error){if(request===modelRequest)status.textContent=error.message;}
 finally{if(request===modelRequest)model.disabled=false;}
}

 const owner=byId('task-form').elements.target, previous=owner.value;
 owner.replaceChildren(new Option('미배정',''),...participants.map(person=>new Option(person.name,person.id)));

 byId('task-list').replaceChildren(...roomTasks.map(task=>{

   action('수정',()=>taskEdit(task));
   const recipients=participants.filter(person=>person.id!==task.owner);
   if(recipients.length){

   }
   action('완료',()=>{void taskAction('handoff_complete',task);});
  }else if(task.status==='offered'){
   action('수락 처리',()=>{void taskAction('handoff_accept',task);});
   action('거절 처리',()=>{void taskAction('handoff_decline',task);});
  }
  action('이력',async()=>{
   try{
    const response=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'handoff_history',room:handoffRoom,id:task.id})});
    const result=await response.json();if(!response.ok)throw Error(result.error);
    const labels={handoff_create:'생성',handoff_update:'수정',handoff_offer:'인계 요청',handoff_accept:'수락',handoff_decline:'거절',handoff_complete:'완료'};
    details.replaceChildren(...result.events.map(event=>el('p',new Date(event.created).toLocaleString('ko-KR')+' · '+(event.actor.startsWith('human:')?'나':name(event.actor))+' · '+labels[event.action]+(event.note?' · '+event.note:''))));
    details.hidden=!details.hidden;
   }catch(error){byId('handoff-error').textContent=error.message;}
  });
  const details=el('section','');details.hidden=true;
  card.append(buttons,details);return card;
 }));
}

let pendingFiles=[];
function renderAttachments(){
 byId('attach-list').replaceChildren(...pendingFiles.map((file,index)=>{
  const chip=el('span',file.name+' ('+Math.max(1,Math.round(file.size/1024))+'KB)');
  const remove=el('button','×');remove.type='button';
  remove.onclick=()=>{pendingFiles.splice(index,1);renderAttachments();};
  chip.append(remove);return chip;
 }));
}
async function addFiles(fileList){
 for(const file of fileList||[]){
  if(pendingFiles.length>=10){err('파일은 한 번에 10개까지 첨부할 수 있어요.');break;}
  if(file.size>8*1024*1024){err(file.name+' 파일이 8MB를 초과합니다.');continue;}
  const buf=await file.arrayBuffer();
  let bin='';const bytes=new Uint8Array(buf);
  for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.subarray(i,i+8192));
  pendingFiles.push({name:file.name||'image.png',type:file.type,size:file.size,data:btoa(bin)});
 }
 renderAttachments();
}

byId('update').onclick=async()=>{
 const button=byId('update'), status=byId('update-result');button.disabled=true;
 status.textContent='확인 중…';
 try{
  const res=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'check_update'})});
  const info=await res.json();if(!res.ok)throw Error(info.error);
  status.textContent=info.available?'설치됨 v'+info.version+' · 업데이트 '+info.latest+' ':'v'+info.version+'이 최신 버전이에요.';
  if(info.download){
   const link=el('a','Windows ZIP 받기');link.href=info.download;link.target='_blank';link.rel='noopener';
   const install=el('button','업데이트 설치');
   install.onclick=async()=>{
    install.disabled=true;
    try{
     const result=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'apply_update',tag:info.latest})});
     if(!result.ok)throw Error((await result.json()).error);
     status.textContent='설치 요청을 보냈어요. '+info.latest+' 실행을 확인하는 중이에요.';
    for(let attempt=0;attempt<200;attempt++){
     await new Promise(resolve=>setTimeout(resolve,2000));
     if('v'+snapshot?.version===info.latest){location.reload();return;}
     if(snapshot?.updateStatus){
      status.textContent=snapshot.updateStatus;
      if(/failed|실패/i.test(snapshot.updateStatus)){status.append(document.createTextNode(' '),link);return;}
     }
    }
    status.textContent='아직 '+info.latest+' 실행을 확인하지 못했어요. 현재 버전을 확인하거나 ZIP으로 설치하세요.';
    status.append(document.createTextNode(' '),link);
    }catch(error){err(error.message);install.disabled=false;}
   };
   status.append(install,document.createTextNode(' '),link);
  }
 }catch(error){status.textContent=error.message;}finally{button.disabled=false;}
};
